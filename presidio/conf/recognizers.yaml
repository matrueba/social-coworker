# Reconocedores para documentación de servicios sociales en España.
supported_languages:
  - es
global_regex_flags: 26

recognizers:
  # NER de spaCy (PERSON, LOCATION, ORGANIZATION), con el modelo de conf/nlp.yaml.
  - name: SpacyRecognizer
    supported_languages:
      - es
    type: predefined

  - name: EsNifRecognizer
    supported_languages:
      - es
    type: predefined

  - name: EsNieRecognizer
    supported_languages:
      - es
    type: predefined

  # Teléfonos españoles (fijos y móviles), con o sin prefijo +34.
  # Se usa un patrón porque PhoneRecognizer no detecta formatos habituales como "612 345 678".
  - name: EsPhoneRecognizer
    supported_language: es
    supported_entity: PHONE_NUMBER
    type: custom
    patterns:
      - name: es_phone
        regex: '(?<![\d/])(?:(?:\+|00)34[\s-]?)?[6789]\d{2}[\s.-]?\d{2,3}[\s.-]?\d{2}[\s.-]?\d{0,2}(?![\d/])'
        score: 0.6
    context: [teléfono, telefono, tlf, tel, móvil, movil, llamar, contacto]

  - name: EmailRecognizer
    supported_languages:
      - language: es
        context: [correo, email, e-mail]
    type: predefined

  - name: IbanRecognizer
    supported_languages:
      - language: es
        context: [iban, cuenta, banco, bancaria]
    type: predefined

  - name: CreditCardRecognizer
    supported_languages:
      - language: es
        context: [tarjeta, crédito, credito, débito, debito, visa, mastercard]
    type: predefined

  # Número de la Seguridad Social (NSS/NAF): 2 dígitos de provincia + 8 + 2 de control.
  # Sin validación de dígito de control: se apoya en el contexto para subir la puntuación.
  - name: EsNssRecognizer
    supported_language: es
    supported_entity: ES_NSS
    type: custom
    patterns:
      - name: es_nss
        regex: "\\b\\d{2}[ /-]?\\d{8}[ /-]?\\d{2}\\b"
        score: 0.4
    context: [seguridad social, nss, naf, afiliación, afiliacion]

  # Tarjeta sanitaria individual (CIP autonómico): 4 letras + 10 dígitos o similar.
  - name: EsTarjetaSanitariaRecognizer
    supported_language: es
    supported_entity: ES_HEALTH_CARD
    type: custom
    patterns:
      - name: es_cip
        regex: "\\b[A-Z]{4}\\d{6,10}[A-Z0-9]{0,2}\\b"
        score: 0.3
    context: [tarjeta sanitaria, cip, tsi, sanitaria]

  # Direcciones postales (tipo de vía + nombre + número). El municipio no se anonimiza:
  # el agente lo necesita para localizar la normativa y los recursos aplicables.
  - name: EsAddressRecognizer
    supported_language: es
    supported_entity: ES_ADDRESS
    type: custom
    patterns:
      - name: es_address
        regex: '\b(?:calle|c/|avda\.?|avenida|plaza|pza\.?|paseo|camino|carretera|ctra\.?|ronda|travesía|travesia|urbanización|urb\.?)\s+[^\n,;:]{2,50}?,?\s*(?:n[º°o.]?\s*)?\d{1,4}(?:[\s,]*\d{1,2}[º°ª]?\s*[a-z]?)?\b'
        score: 0.6
    context: [domicilio, dirección, direccion, vive, reside, empadronada, empadronado]
